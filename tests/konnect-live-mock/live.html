<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Konnect Live (mock)</title>
<style>
body { margin: 0; font-family: sans-serif; background: #fff; }
nav { background: #222; height: 50px; }
.ng-hide { display: none !important; }
/* Bootstrap's own rule, which Konnect Live's menu bar items carry. */
@media (min-width: 768px) and (max-width: 991px) { .hidden-sm { display: none !important; } }
#searchForm, #loginForm { padding: 70px 20px 10px; }
.tl-row { padding: 6px 20px; border-bottom: 1px solid #eee; }
.modal { position: fixed; left: 40px; top: 90px; width: 440px; background: #fff; border: 1px solid #999; box-shadow: 0 8px 30px rgba(0,0,0,0.3); padding: 12px; }
</style>
</head>
<body>
<!-- A stand-in for Konnect Live, enough for the Lead Checker to search for
     a customer and open a timeline. Fictional data only.
     - An email containing "none" finds nobody.
     - A search containing "reedwell" finds Morgan Reedwell, whose timeline
       has two leads (one Post Closure) and a call. A search containing
       "tavistock" finds Jo Tavistock, with one lead. Clicking a lead's icon
       opens a lead window the Lead Checker can read; Escape closes it.
     - A search containing "bookwell" finds Casey Bookwell, booked in on
       13 Nov 2026: an appointment made at 10:02, its call outcome at 10:04
       and the send to the dealership at 10:06, after an earlier send at
       09:10 and an appointment from 2 Nov.
     - Any other search finds one customer whose timeline has no sales leads.
     window.mock.logOut() swaps the page for the login form; pressing Login
     brings it back. -->
<nav class="navbar navbar-inverse navbar-fixed-top"><ul class="nav navbar-right top-nav"><li>Menu</li></ul><div class="navbar-collapse"></div></nav>
<div id="searchForm">
  <label><input type="radio" name="bookingSearchBy" value="1"> Name</label>
  <label><input type="radio" name="bookingSearchBy" value="3"> Phone</label>
  <label><input type="radio" name="bookingSearchBy" value="4"> Email</label>
  <label><input type="radio" name="bookingSearchBy" value="5"> Reg</label>
  <input type="text" ng-model="uiSettings.searchText">
  <button id="btnSearch">Search</button>
  <div><label>Records Found:</label> <span class="ng-binding"></span> <i class="fa fa-refresh ng-hide"></i></div>
  <div id="grid"></div>
</div>
<div ng-view></div>
<script>
(function () {
  const mock = window.mock = { searches: [], opened: 0, searchDelay: 120, timelineDelay: 120, modalDelay: 80, loginClicks: 0, openedIds: [], modalOpens: [], modalCloses: 0 };
  // The Lead Checker reads each timeline row's data the way it does on the
  // real page, through angular.element(row).scope().item.
  window.angular = { element: (el) => ({ scope: () => (el && el.__scope) || null }) };
  const lead = (id, shown, iso, source, campaign, request, notes) => ({ kind: 'lead', id, shown, iso, source, campaign, request, notes });
  // Any other timeline entry: its heading, description and time, as the
  // Lead Checker reads them from the row's scope.
  const event = (type, shown, iso, title, desc) => ({ kind: 'event', type, shown, iso, title, desc });
  const SENT = 'Lead sent by Sam Tester and successfuly received at Crawley';
  const CUSTOMERS = {
    bookwell: { id: 700400, name: 'Casey Bookwell', phone: '07700 900323', reg: 'EF56GHJ', entries: [
      event(2, '13 Nov 2026 10:06', '2026-11-13T10:06:12.480+00:00', 'Lead sent to Enquiry Max', SENT),
      event(3, '13 Nov 2026 10:04', '2026-11-13T10:04:30+00:00', 'Sam Tester called the customer with an outcome of Spoke To Customer', 'Sales -> ART -> Appointment -> Test Drive at Crawley'),
      event(5, '13 Nov 2026 10:02', '2026-11-13T10:02:05+00:00', 'Appointment Created', 'Appointment Created by Sam Tester of type Test Drive at Crawley'),
      lead(1386500, '13 Nov 2026 09:40', '2026-11-13T09:40:00', 'Customer First', 'Enquiry - New', 'Test Drive', 'Would like a test drive this weekend.'),
      event(2, '13 Nov 2026 09:10', '2026-11-13T09:10:00+00:00', 'Lead sent to Enquiry Max', SENT),
      event(5, '2 Nov 2026 15:20', '2026-11-02T15:20:00+00:00', 'Appointment Created', 'Appointment Created by Sam Tester of type Face to Face at Crawley')
    ] },
    reedwell: { id: 700200, name: 'Morgan Reedwell', phone: '07700 900321', reg: 'AB12CDE', entries: [
      { kind: 'call', id: 1386301, shown: '10 Nov 2026 11:42', iso: '2026-11-10T11:42:00', title: 'Agent A called the customer' },
      lead(1386301, '10 Nov 2026 09:05', '2026-11-10T09:05:00', 'Customer First', 'Enquiry - New', 'Test Drive', 'Would like to test drive a 2008 this coming Saturday.'),
      lead(1386302, '9 Nov 2026 14:00', '2026-11-09T14:00:00', 'Post Closure Processing', 'Enquiry - Used', '', 'Customer Comments: -')
    ] },
    tavistock: { id: 700300, name: 'Jo Tavistock', phone: '07700 900322', reg: 'CD34EFG', entries: [
      lead(1386400, '8 Nov 2026 11:30', '2026-11-08T11:30:00', 'Robins & Day Website', 'Peugeot - Enquiry - New', '', 'Can I come in on Saturday at 10am to see it? Also I need to ask about my warranty on the old car')
    ] }
  };
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // "Tue 10th Nov 2026 09:05", as the lead window shows it.
  function windowDate(iso) {
    const d = new Date(iso);
    const n = d.getDate();
    const th = n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th';
    return `${DAYS[d.getDay()]} ${n}${th} ${MONTHS[d.getMonth()]} ${d.getFullYear()} ${iso.slice(11, 16)}`;
  }
  function customerFor(text) {
    const key = Object.keys(CUSTOMERS).find((k) => text.toLowerCase().includes(k));
    return key ? CUSTOMERS[key] : { id: 700123, name: 'Sam Example', reg: 'AB12CDE', entries: [] };
  }
  function closeLeadWindow() {
    const open = document.querySelector('.modal');
    if (!open) return;
    open.remove();
    mock.modalCloses++;
  }
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeLeadWindow(); });
  function showLeadWindow(customer, entry) {
    mock.modalOpens.push(entry.id);
    setTimeout(() => {
      closeLeadWindow();
      const modal = document.createElement('div');
      modal.className = 'modal in';
      modal.setAttribute('role', 'dialog');
      modal.dataset.leadId = entry.id;
      modal.innerHTML = '<ul><li><a class="nav-link">Lead Details</a></li></ul><div class="tab-pane active">'
        + `<div><div>Date</div><footer><strong class="ng-binding">${windowDate(entry.iso)}</strong></footer></div>`
        + `<div><div>Source</div><footer><strong class="ng-binding">${entry.source}</strong></footer></div>`
        + `<div>Campaign<span>${entry.campaign}</span>${entry.request ? `<span>(${entry.request})</span>` : ''}</div>`
        + `<a ng-click="navToConnectedCustomer()"><strong class="ng-binding">${customer.name}</strong> <strong class="ng-binding">(${customer.phone})</strong></a>`
        + `<div id="txtInitialNotes">${entry.notes}</div></div>`;
      document.body.appendChild(modal);
    }, mock.modalDelay);
  }
  function timelineRow(customer, entry) {
    const row = document.createElement('div');
    row.className = 'row ng-scope tl-row';
    row.setAttribute('ng-repeat', 'item in customerTimeLine');
    if (entry.kind === 'event') {
      row.innerHTML = `<a class="connected-customer-timeline-centre-grey"><i class="fa">e</i></a> <span>${entry.shown}</span> <span>${entry.title}</span> <span>${entry.desc}</span>`;
      row.__scope = { item: { TimelineItemType: entry.type, LeadID: 1386500, EventTime: entry.iso, BelowLineTitle: entry.title, Description: entry.desc } };
      return row;
    }
    if (entry.kind === 'call') {
      row.innerHTML = `<a class="connected-customer-timeline-centre-lightblue"><i class="fa fa-phone">c</i></a> <span class="connected-customer-timeline-heading-left-lightblue">${entry.shown}</span> <span class="connected-customer-title-lightblue">${entry.title}</span>`;
      row.__scope = { item: { TimelineItemType: 3, LeadID: entry.id, EventTime: entry.iso, Description: '', BelowLineTitle: '' } };
      return row;
    }
    row.innerHTML = `<a class="connected-customer-timeline-centre-pink"><i ng-click="showDetails(item)" class="fa fa-car">o</i></a> <span class="connected-customer-timeline-heading-left-pink">${entry.shown} <span title="This is the Konnect Lead ID">(${entry.id})</span></span> <span class="connected-customer-title-pink">New Sales Lead from ${entry.source}</span>`;
    row.__scope = { item: { TimelineItemType: 1, LeadID: entry.id, EventTime: entry.iso, Description: `New Sales Lead from ${entry.source}` } };
    row.querySelector('i').addEventListener('click', () => showLeadWindow(customer, entry));
    return row;
  }
  const view = document.querySelector('[ng-view]');
  const grid = document.getElementById('grid');
  const input = document.querySelector('input[ng-model="uiSettings.searchText"]');
  const found = document.querySelector('#searchForm span.ng-binding');
  const spinner = document.querySelector('#searchForm i.fa-refresh');

  document.getElementById('btnSearch').addEventListener('click', () => {
    const text = input.value;
    mock.searches.push(text);
    spinner.classList.remove('ng-hide');
    setTimeout(() => {
      grid.innerHTML = '';
      const none = /none/i.test(text);
      if (!none) {
        const customer = customerFor(text);
        grid.innerHTML = `<div role="row" row-index="0"><div col-id="CustomerName"><a ng-click="navToConnectedCustomer(${customer.id})">${customer.name}</a></div><div col-id="DealerName">Preston</div><div col-id="RegistrationNumber">${customer.reg}</div><div col-id="Summary"></div></div>`;
        grid.querySelector('a').addEventListener('click', () => openCustomer(customer));
      }
      found.textContent = none ? '0' : '1';
      spinner.classList.add('ng-hide');
    }, mock.searchDelay);
  });

  function openCustomer(customer) {
    mock.opened++;
    mock.openedIds.push(customer.id);
    location.hash = `#/connectedCustomer/${customer.id}?redirectRoute=%2Fsearch`;
    view.innerHTML = '<div class="ng-scope"><div class="row timeline-editing-header">' + customer.name + ' <i title="Refreshing..." ng-show="loading" class="fa ng-hide">.</i><i title="Refresh" ng-show="!loading" class="fa ng-hide">R</i></div><div style="margin-top:80px;"></div></div>';
    const timeline = view.querySelector('div[style="margin-top:80px;"]');
    customer.entries.forEach((entry) => timeline.appendChild(timelineRow(customer, entry)));
    setTimeout(() => {
      const ready = view.querySelector('i[title="Refresh"]');
      if (ready) ready.classList.remove('ng-hide');
    }, mock.timelineDelay);
  }

  window.addEventListener('hashchange', () => { if (/^#\/search/.test(location.hash)) view.innerHTML = ''; });

  mock.logOut = () => {
    const navHtml = '<ul class="nav navbar-right top-nav"><li>Menu</li></ul><div class="navbar-collapse"></div>';
    document.querySelector('nav').remove();
    document.getElementById('searchForm').style.display = 'none';
    view.innerHTML = '';
    const form = document.createElement('div');
    form.id = 'loginForm';
    form.innerHTML = '<input type="password"><button class="btn-login" id="loginBtn" style="width:120px;height:40px">Login</button>';
    document.body.appendChild(form);
    form.querySelector('button').addEventListener('click', () => {
      mock.loginClicks++;
      if (!mock.allowLogin) return;
      form.remove();
      const nav = document.createElement('nav');
      nav.className = 'navbar navbar-inverse navbar-fixed-top';
      nav.innerHTML = navHtml;
      document.body.insertBefore(nav, document.body.firstChild);
      document.getElementById('searchForm').style.display = '';
    });
  };
})();
</script>
</body>
</html>
